name: Update Top Projects Showcase

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-showcase:
    runs-on: ubuntu-latest
    steps:
      - name: Update README showcase
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username = context.repo.owner;
            const repoName = context.repo.repo;
            const readmePath = "README.md";

            const repos = await github.paginate(github.rest.repos.listForUser, {
              username,
              per_page: 100,
              sort: "updated",
            });

            const profileRepoName = username.toLowerCase();
            const candidates = repos
              .filter((repo) => !repo.fork && !repo.archived && repo.name.toLowerCase() !== profileRepoName)
              .map((repo) => {
                const stars = repo.stargazers_count ?? 0;
                const forks = repo.forks_count ?? 0;
                const watchers = repo.watchers_count ?? 0;
                const hasLanguage = repo.language ? 1 : 0;
                const hasDescription = repo.description ? 1 : 0;
                const lastPush = repo.pushed_at ? new Date(repo.pushed_at) : null;

                let activityScore = 0;
                if (lastPush) {
                  const daysSincePush = Math.floor((Date.now() - lastPush.getTime()) / (1000 * 60 * 60 * 24));
                  if (daysSincePush <= 30) activityScore = 12;
                  else if (daysSincePush <= 90) activityScore = 8;
                  else if (daysSincePush <= 180) activityScore = 5;
                  else if (daysSincePush <= 365) activityScore = 2;
                }

                const score =
                  stars * 4 +
                  forks * 3 +
                  watchers * 2 +
                  hasLanguage * 2 +
                  hasDescription * 2 +
                  activityScore;

                return { repo, score };
              })
              .sort((a, b) => b.score - a.score)
              .slice(0, 6);

            const formatCell = ({ repo, score }) => {
              const description = (repo.description || "No description provided.")
                .replace(/\|/g, "\\|")
                .slice(0, 140);
              const language = repo.language || "Not specified";
              return [
                `### [${repo.name}](${repo.html_url})`,
                `${description}`,
                `**Language:** ${language}`,
                `**⭐ ${repo.stargazers_count} · 🍴 ${repo.forks_count} · 👀 ${repo.watchers_count} · 📈 ${score}**`,
              ].join("<br>");
            };

            const cells = candidates.map(formatCell);
            const rows = [];
            for (let i = 0; i < cells.length; i += 2) {
              const left = cells[i] ?? "";
              const right = cells[i + 1] ?? "";
              rows.push(`| ${left} | ${right} |`);
            }

            const showcaseBody =
              candidates.length === 0
                ? "_No eligible repositories found._"
                : [
                    "| Project A | Project B |",
                    "| --- | --- |",
                    ...rows,
                  ].join("\n");

            const generatedSection = [
              "## 🚀 Top Projects Showcase",
              "",
              "_Auto-updated every Monday via GitHub Actions._",
              "",
              showcaseBody,
              "",
              "<!-- TOP_PROJECTS_SHOWCASE:START -->",
              `<!-- Last updated: ${new Date().toISOString()} -->`,
              "<!-- TOP_PROJECTS_SHOWCASE:END -->",
            ].join("\n");

            const { data: readme } = await github.rest.repos.getContent({
              owner: username,
              repo: repoName,
              path: readmePath,
            });

            const readmeContent = Buffer.from(readme.content, "base64").toString("utf8");
            const startMarker = "<!-- TOP_PROJECTS_SECTION_START -->";
            const endMarker = "<!-- TOP_PROJECTS_SECTION_END -->";

            const sectionWithMarkers = [
              startMarker,
              generatedSection,
              endMarker,
            ].join("\n");

            let updatedReadme;
            const markerPattern = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`, "m");
            if (markerPattern.test(readmeContent)) {
              updatedReadme = readmeContent.replace(markerPattern, sectionWithMarkers);
            } else {
              updatedReadme = `${readmeContent.trimEnd()}\n\n---\n\n${sectionWithMarkers}\n`;
            }

            if (updatedReadme === readmeContent) {
              core.info("README is already up to date.");
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: username,
              repo: repoName,
              path: readmePath,
              message: "chore: refresh top projects showcase",
              content: Buffer.from(updatedReadme).toString("base64"),
              sha: readme.sha,
            });
